<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christmas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slideInLeft {
      from {
        transform: translateX(-100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .slide-in-left {
      animation: slideInLeft 1.2s ease-out forwards;
    }
  </style>
</head>

<body class="bg-rose-500 font-sans relative min-h-screen overflow-hidden">

  <!-- Navbar -->
  <nav class="bg-rose-200 shadow-md fixed top-0 left-0 w-full z-20">
    <div class="max-w-6xl mx-auto px-4 flex justify-between items-center h-14">
      <div class="text-white font-bold text-xl">LOGO</div>
      <ul class="flex space-x-6">
        <li><a href="#" class="text-white font-semibold hover:text-yellow-300">Home</a></li>
        <li><a href="#" class="text-white font-semibold hover:text-yellow-300">About</a></li>
        <li><a href="#" class="text-white font-semibold hover:text-yellow-300">Gallery</a></li>
        <li><a href="#" class="text-white font-semibold hover:text-yellow-300">Chat</a></li>
        <li><a href="#" class="text-white font-semibold hover:text-yellow-300">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- เนื้อหาหลัก -->
  <div class="flex justify-center items-center h-screen relative z-10">
    <h1 id="title" class="text-9xl font-[cursive] text-yellow-300 opacity-0">
      Christmas
    </h1>
  </div>

  <!-- องค์ประกอบภาพ -->
  <div>
    <!-- Santa -->
    <img src="img/kwang.png" alt="Santa"
      class="absolute bottom-0 left-6 w-[600px] drop-shadow-lg z-10 santa-move slide-in-left">

    <!-- Mountain -->
    <img src="img/bg.png" alt="Mountain" class="absolute bottom-0 left-0 w-full  z-0">
  </div>


  <script>
    window.addEventListener("load", () => {
      const title = document.getElementById("title");

      setTimeout(() => {
        title.classList.add("slide-in-left");
      }, 300);
    });
  </script>
</body>
</html>
