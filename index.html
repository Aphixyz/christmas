<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ - Login</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <img src="images/w1.png" alt="Logo" class="logo" />
        <h2 class="welcome-text">ยินดีต้อนรับ</h2>
        <p class="subtitle">กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>
      </div>

      <form class="login-form" action="" method="post">
        <div class="input-group">
          <label for="username">ชื่อผู้ใช้</label>
          <input id="username" name="username" type="text" placeholder="กรอกชื่อผู้ใช้" required />
        </div>

        <div class="input-group">
          <label for="password">รหัสผ่าน</label>
          <input id="password" name="password" type="password" placeholder="กรอกรหัสผ่าน" required />
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" name="remember">
            <span class="checkmark"></span>
            จดจำการเข้าสู่ระบบ
          </label>
          <a href="#" class="forgot-password">ลืมรหัสผ่าน?</a>
        </div>

        <a href="result.html" type="submit"  class="login-btn">เข้าสู่ระบบ</a>
      </form>

      <div class="footer-text">
        <p>ยังไม่มีบัญชี? <a href="#" class="register-link">สมัครสมาชิก</a></p>
      </div>
    </div>
  </div>
</body>

</html>
