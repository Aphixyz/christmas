<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Santa ขยับขึ้นลง (ใช้หลังจาก slide จบ) */
    @keyframes floatSanta {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    .santa-float {
      animation: floatSanta 3s ease-in-out infinite;
    }

    /* Slide เข้าจากซ้าย */
    @keyframes slideInLeft {
      from {
        transform: translateX(-150%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Slide เข้าจากขวา */
    @keyframes slideInRight {
      from {
        transform: translateX(150%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .slide-in-left {
      animation: slideInLeft 1.5s ease-out forwards;
    }

    .slide-in-right {
      animation: slideInRight 1.5s ease-out forwards;
    }
  </style>
</head>

<body class="bg-rose-500 font-sans relative min-h-screen overflow-hidden">
  <!-- Navbar -->
  <nav class="bg-rose-200 shadow-md relative z-20">
    <div class="max-w-6xl mx-auto px-4 flex justify-between items-center h-14">
      <div class="text-white font-bold text-xl">LOGO</div>
      <ul class="flex space-x-6">
        <li><a href="" class="text-white font-semibold hover:text-yellow-300">Home</a></li>
        <li><a href="" class="text-white font-semibold hover:text-yellow-300">About</a></li>
        <li><a href="" class="text-white font-semibold hover:text-yellow-300">Gallery</a></li>
        <li><a href="" class="text-white font-semibold hover:text-yellow-300">Chat</a></li>
        <li><a href="" class="text-white font-semibold hover:text-yellow-300">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- ฟอร์มเข้าสู่ระบบ -->
  <div class="flex flex-col items-center mt-12 relative z-10">
    <!-- ตัวหนังสือ Christmas -->
    <h1 id="title" class="text-8xl font-[cursive] text-yellow-300 mb-8 opacity-0">
      Christmas
    </h1>

    <div class="w-80 opacity-0" id="loginBox">
      <!-- ชื่อผู้ใช้ -->
      <div class="mb-6">
        <label for="username" class="block mb-2 text-yellow-300 font-bold">ชื่อผู้ใช้</label>
        <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้"
          class="w-full p-3 rounded-lg border-none focus:ring-2 focus:ring-yellow-300 outline-none" />
      </div>

      <!-- รหัสผ่าน -->
      <div class="mb-6">
        <label for="password" class="block mb-2 text-yellow-300 font-bold">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="กรอกรหัสผ่าน"
          class="w-full p-3 rounded-lg border-none focus:ring-2 focus:ring-yellow-300 outline-none" />
        <div class="text-right mt-2">
          <a href="" class="text-yellow-300 text-sm hover:underline">ลืมรหัสผ่าน?</a>
        </div>
      </div>

      <!-- ปุ่มเข้าสู่ระบบ -->
      <button class="w-full bg-yellow-300 hover:bg-yellow-400 text-black font-bold py-3 rounded-lg shadow-md">
        เข้าสู่ระบบ
      </button>
    </div>
  </div>

  <div>
    <!-- Santa -->
    <img src="img/santa.png" alt="Santa"
      class="absolute bottom-0 left-6 w-[400px] drop-shadow-lg z-10 santa-move slide-in-left">

    <!-- Mountain -->
    <img src="img/bg3.png" alt="Mountain" class="absolute bottom-0 left-0 w-full  z-0">
  </div>

  <script>
    window.addEventListener("load", () => {
      document.getElementById("title").classList.add("slide-in-right");
      setTimeout(() => {
        document.getElementById("loginBox").classList.add("slide-in-left");
      }, 500);
      const santa = document.getElementById("santa");
      santa.classList.add("slide-in-left");
      santa.addEventListener("animationend", () => {

        santa.classList.add("santa-float");
      });
    });
  </script>
</body>

</html>
